kind = "mobile"
previewPath = "/"
title = "Web Academy"
version = "1.0.0"
id = "artifacts/menga-web-academy"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18218

[services.development]
run = "pnpm --filter @workspace/web-academy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web-academy", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/web-academy/server/serve.js" ]

[services.production.run.env]
PORT = "18218"
BASE_PATH = "/"
NODE_ENV = "production"

[services.env]
PORT = "18218"
BASE_PATH = "/"
